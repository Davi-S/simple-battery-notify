name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck, shfmt and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt bats
      - name: shellcheck + shfmt
        run: make check
      - name: Tests
        run: make test
